name: Catalog

# Two jobs, because a contributor and this repo are held to different standards:
#
#   validate  runs on pull requests, and only checks that the SOURCES are valid. A
#             contributor edits servers/*.json or a manifest and is not expected to run
#             the generator, so a stale catalog.json on a PR is normal, not a failure.
#
#   rebuild   runs after merge, regenerates the outputs and commits them. This is the
#             only thing that writes catalog.json / index.json / registry.json — so a
#             hand-edit of those files gets silently reverted on the next push. Edit a
#             source instead.
#
#   api       runs the catalog service's tests on both, because those tests read the
#             committed catalog.json and assert what it may and may not serve — a client
#             secret must never appear, a half-configured server must stay hidden. They
#             are the reason the service lives in this repo rather than beside its deploy.

on:
  pull_request:
    paths:
      - "servers/**"
      - "tools/**/manifest.json"
      - "scripts/**"
      - "api/**"
  push:
    branches: [main]
    paths:
      - "servers/**"
      - "tools/**/manifest.json"
      - "scripts/**"
      - "api/**"

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install jsonschema
      - name: Validate against the MCP server.json schema
        run: python3 scripts/build_catalog.py --validate

  rebuild:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: pip install jsonschema

      - name: Rebuild the catalog
        run: python3 scripts/build_catalog.py

      - name: Commit the generated catalog
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog.json index.json registry.json
          git diff --staged --quiet || git commit -m "chore: regenerate catalog"
          git push

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install jsonschema

      # Regenerated first, without committing, so these tests see the catalog this
      # branch WOULD produce. On a pull request the committed catalog.json is expected
      # to be stale — the contributor isn't asked to run the generator.
      - name: Rebuild the catalog into the workspace
        run: python3 scripts/build_catalog.py

      - name: Test the catalog API against it
        working-directory: api
        run: |
          npm install
          npx tsc --noEmit
          npm test
